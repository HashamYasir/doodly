  <meta name="theme-color" content="#fbf8f1">
  <!--
    This page can be served from any depth (e.g. /oops/nothing/here), so relative links would break.
    This tiny script points every link and file at the real site root first.
    GitHub project sites live at /<repo-name>/, everything else lives at /.
  -->
  <script>
    (function () {
      var p = location.pathname.split('/');
      var base = /\.github\.io$/.test(location.hostname) && p[1] ? '/' + p[1] + '/' : '/';
      document.write('<base href="' + base + '">');
    })();
  </script>

  <script src="assets/js/not-found.js" defer></script>
</head>
